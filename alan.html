<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GastroPazar • Pazar alanı</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#334155;font:15px Inter,system-ui}header{padding:20px max(20px,calc((100vw - 1150px)/2));background:white;border-bottom:1px solid #ddd}a{color:#e65100;text-decoration:none}main{max-width:1160px;margin:40px auto;padding:0 18px}h1{font:700 32px Merriweather,serif}.muted{color:#64748b}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:white;border-radius:16px;overflow:hidden;border:1px solid #e5e7eb}.card img{width:100%;height:170px;object-fit:cover}.card>div{padding:18px}.price{color:#e65100;font-weight:800}.notice{background:#fff7ed;border:1px solid #fed7aa;padding:14px;border-radius:12px;margin:20px 0}</style></head><body><header><a href="/">← <strong>GastroPazar</strong></a></header><main><h1 id="name">Pazar alanı</h1><p class="muted" id="sub">Yayın durumu kontrol ediliyor...</p><div id="catalog"></div></main><script>(async()=>{const p=new URLSearchParams(location.search),country=p.get('country'),period=p.get('period');if(!/^[A-Z]{2}$/.test(country||'')||!period){document.getElementById('sub').textContent='Geçersiz pazar adresi';return}try{const r=await fetch('/api/market-areas',{cache:'no-store'});if(!r.ok)throw Error('Yayın bilgileri alınamadı');const j=await r.json();const area=j.areas.find(x=>x.country_code===country&&x.period_key===period);if(!area){document.getElementById('sub').textContent='Bu alan şu anda yayında değil.';return}document.title=area.title+' • GastroPazar';document.getElementById('name').textContent=area.title;document.getElementById('sub').textContent=country+' · '+period.replaceAll('-',' ');const div=document.getElementById('catalog');div.innerHTML='<h2>Bu alanda yayındaki yemekler</h2><div class="cards" id="cards"></div>';const d=await fetch('/api/public-products?country='+encodeURIComponent(country)+'&period='+encodeURIComponent(period),{cache:'no-store'}).then(x=>x.json());const grid=document.getElementById('cards');if(!d.products?.length){const msg=document.createElement('div');msg.className='notice';msg.textContent='Bu alan yayında ancak henüz yayınlanmış yemek bulunmuyor. Şefler ürün ekledikçe burada görünecek.';grid.append(msg)}for(const p of d.products||[]){const el=document.createElement('article');el.className='card';if(p.image_url){const im=document.createElement('img');im.loading='lazy';im.src=p.image_url;im.alt=p.title;el.append(im)}const body=document.createElement('div'),h=document.createElement('h3'),description=document.createElement('p'),cost=document.createElement('p');h.textContent=p.title;description.className='muted';description.textContent=p.description||p.location||'';cost.className='price';cost.textContent='€'+Number(p.price).toFixed(2);body.append(h,description,cost);el.append(body);grid.append(el)}}}catch(e){document.getElementById('sub').textContent='Alan yüklenemedi: '+e.message}})()</script></body></html>

<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giriş • GastroPazar</title><style>body{margin:0;background:#faf8f4;font:16px system-ui;color:#27312d}main{max-width:430px;margin:9vh auto;background:white;border:1px solid #e5e7eb;border-radius:20px;padding:32px;box-shadow:0 8px 30px #0001}a{color:#147d62}input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:10px;font:inherit}button{background:#147d62;color:white;border:0;cursor:pointer}.error{color:#b42318}label{display:block;margin-top:8px}</style></head><body><main><a href="/">← GastroPazar</a><h1>GastroPazar hesabım</h1><p style="font-size:13px;background:#fff3e0;padding:13px;border-radius:10px"><b>Hesap açmadan test etmek ister misin?</b> <a href="/demo.html">🎭 Demo merkezini aç</a> — admin, şef ve müşteri ekranlarını deneyebilirsin.</p><p>Müşteri olarak kaydolun veya hesabınıza giriş yapın.</p><form id="f"><label>Ad soyad (yalnızca yeni kayıt)<input name="name" autocomplete="name"></label><label>E-posta<input name="email" type="email" required autocomplete="email"></label><label>Şifre<input name="password" type="password" minlength="12" required autocomplete="current-password"></label><button name="action" value="login">Giriş yap</button><button name="action" value="register" style="background:#fff;color:#147d62;border:1px solid #147d62">Yeni hesap oluştur</button><p class="error" id="msg" role="alert"></p></form></main><script>document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>window.intent=b.value));document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,data=Object.fromEntries(new FormData(form));data.action=window.intent||'login';const msg=document.getElementById('msg');msg.textContent='';try{const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),x=await r.json();if(!r.ok)throw Error(x.error||'Giriş başarısız');location.href='/panel.html'}catch(err){msg.textContent=err.message}})</script></body></html>

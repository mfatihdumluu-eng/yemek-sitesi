<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GastroPazar • Demo Merkezi</title><style>body{font:16px system-ui;margin:0;color:#303b34;background:#faf8f4}header{padding:24px 6%;background:white;border-bottom:1px solid #ddd}main{max-width:1100px;margin:auto;padding:26px 20px}a{color:#137d62}button,select,input{padding:11px;border:1px solid #d6ddd7;border-radius:8px;font:inherit}button{background:#147d62;color:white;cursor:pointer}button.active{background:#224a3c}.tabs{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.card{background:white;border:1px solid #e3e7e2;border-radius:14px;padding:20px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.muted{color:#747a74}span.tag{color:#8b651c;background:#fff3d2;padding:5px 10px;border-radius:10px}li{margin:10px 0}</style></head><body><header><h1>GastroPazar Demo Merkezi</h1><a href="/">← Ana sayfaya dön</a>　<span class="tag">Sadece test • Gerçek sipariş yok</span></header><main><p>Orijinal HTML içindeki örnek şefleri ve yemekleri üç farklı rol üzerinden deneyin. Buradaki test işlemleri yalnızca bu demo ekranında çalışır, veritabanına yazılmaz.</p><div class="tabs"><button data-role="admin">Admin ekranı</button><button data-role="chef">Şef ekranı</button><button data-role="customer">Müşteri ekranı</button></div><section id="view"></section></main><script>
let data={chefs:[],products:[]},role=new URLSearchParams(location.search).get('role')||'admin',enabledAreas=[],cart=[],selectedChef=0,orders=[];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/demo-catalog.json').then(x=>x.json()).then(x=>{data=x;render()}).catch(()=>document.getElementById('view').textContent='Demo içerikleri yüklenemedi');
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;history.replaceState(null,'','?role='+role);render()});
function render(){document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role));const el=document.getElementById('view');
if(role==='admin'){el.innerHTML='<h2>Admin önizlemesi</h2><div class="card"><h3>Ülke ve dönem alanları</h3><p>Örnek ülke ve dönem alanlarını test için açıp kapatabilirsiniz. Gerçek ayarlar <a href="/admin.html">admin panelindedir</a>.</p><div id="areas"></div></div><div class="card"><h3>Şef başvuruları (örnek)</h3>'+data.chefs.slice(0,5).map((c,i)=>'<p>'+esc(c.name)+' <button data-review="'+i+'">Onayla</button> <span id="review-'+i+'">Bekliyor</span></p>').join('')+'</div><div class="card"><h3>Katalog özeti</h3><p>'+data.chefs.length+' şef, '+data.products.length+' yemek/menü</p></div>';const areas=document.getElementById('areas');for(const v of ['NL · Genel Pazar','TR · Genel Pazar','NL · Ramazan','DE · Yaz Menüsü']){const b=document.createElement('button');b.textContent=v+' — '+(enabledAreas.includes(v)?'Açık':'Kapalı');b.style.margin='6px';b.onclick=()=>{enabledAreas=enabledAreas.includes(v)?enabledAreas.filter(x=>x!==v):[...enabledAreas,v];render()};areas.append(b)}document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{document.getElementById('review-'+b.dataset.review).textContent='Demo onaylandı'})}
else if(role==='chef'){const c=data.chefs[selectedChef]||{};const mine=data.products.filter(p=>p.chef.toLowerCase().includes(c.name?.split(' ')[0]?.toLowerCase()||'n/a'));el.innerHTML='<h2>Şef önizlemesi</h2><div class="card"><label>Şef seçin: <select id="choose-chef">'+data.chefs.map((c,i)=>'<option value="'+i+'" '+(i===selectedChef?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></label><h3>'+esc(c.name)+'</h3><h4>Menümdeki örnek yemekler</h4><ul>'+mine.map(x=>'<li>'+esc(x.title)+'</li>').join('')+'</ul><p class="muted">Gerçek şefin ürün ekleme, stok ve sipariş yönetimi sonraki aşamada etkinleşecek.</p><button id="test-product">Demo menüye ürün ekle</button><ul id="drafts"></ul></div>';document.getElementById('choose-chef').onchange=e=>{selectedChef=Number(e.target.value);render()};document.getElementById('test-product').onclick=()=>{const li=document.createElement('li');li.textContent='Yeni deneme yemeği (sadece demo)';document.getElementById('drafts').append(li)}}
else{el.innerHTML='<h2>Müşteri önizlemesi</h2><div class="grid">'+data.products.map(p=>'<div class="card"><h3>'+esc(p.title)+'</h3><p>'+esc(p.chef)+'</p><button data-add="'+p.id+'">Sepete ekle</button></div>').join('')+'</div><div class="card"><h3>Deneme sepeti <span id="count">'+cart.length+'</span></h3><p id="cart-items">'+cart.map(p=>esc(p.title)).join(', ')+'</p><button id="test-order">Demo sipariş oluştur</button><p id="order-result"></p></div>';document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{cart.push(data.products.find(p=>p.id===Number(b.dataset.add)));render()});document.getElementById('test-order').onclick=()=>{document.getElementById('order-result').textContent=cart.length?'Deneme siparişi oluşturuldu ('+cart.length+' ürün). Gerçek ödeme alınmadı.':'Önce ürün ekleyin.';cart=[]}}}
render();
</script></body></html>

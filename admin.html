<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin paneli • GastroPazar</title><style>body{margin:0;background:#faf8f4;color:#25382f;font:16px system-ui}header{background:white;border-bottom:1px solid #e5e7eb;padding:20px 7%;display:flex;align-items:center;justify-content:space-between}main{max-width:1000px;margin:45px auto;padding:0 20px}a{color:#137d62}button{background:#137d62;color:white;padding:12px 20px;border:0;border-radius:10px;cursor:pointer}.card{background:white;border:1px solid #e6e7e5;border-radius:16px;padding:24px;margin:20px 0}.muted{color:#65716a}</style></head><body><header><strong>GastroPazar / Admin paneli</strong><a href="/">Ana sayfa</a></header><main><h1>Admin paneli</h1><p id="who" class="muted">Oturum denetleniyor...</p><section id="panel" style="display:none"><div class="card"><h2>Kullanıcı ve şef onayları</h2><p class="muted">Bekleyen satıcı başvurularını inceleyip onaylayabilir veya reddedebilirsiniz.</p><div id="applications">Yükleniyor…</div></div><div class="card"><h2>Platform yönetimi</h2><p class="muted">Ürün, sipariş ve içerik yönetimi burada olacak.</p></div><p><button id="out">Çıkış yap</button></p></section></main><script>(async()=>{try{const r=await fetch('/api/auth',{credentials:'same-origin'}),x=await r.json();if(!x.user){location.replace('/giris.html?next=%2Fadmin.html');return}if(x.user.role!=='admin'){document.getElementById('who').textContent='Bu alana erişim yetkiniz yok. Hesabınızın rolü: '+x.user.role;return}document.getElementById('who').textContent=x.user.display_name+' · '+x.user.email;document.getElementById('panel').style.display='block';
const list=document.getElementById('applications');
async function loadApplications(){const response=await fetch('/api/chef-applications');const data=await response.json();if(!response.ok){list.textContent=data.error||'Başvurular alınamadı';return}list.replaceChildren();if(!data.applications.length){list.textContent='Başvuru bulunamadı';return}for(const a of data.applications){const item=document.createElement('div');item.className='card';for(const line of [a.kitchen_name,a.display_name+' · '+a.email,a.city,a.description,'Durum: '+a.status]){const p=document.createElement('p');p.textContent=line||'';item.append(p)}if(a.status==='pending'){for(const [name,decision] of [['Onayla','approved'],['Reddet','rejected']]){const btn=document.createElement('button');btn.textContent=name;btn.style.marginRight='8px';btn.onclick=async()=>{if(!confirm(name+' işlemini uygulamak istiyor musunuz?'))return;btn.disabled=true;try{const response=await fetch('/api/chef-applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:a.id,decision})});const result=await response.json();if(!response.ok)throw Error(result.error||'İşlem başarısız');await loadApplications()}catch(e){alert(e.message);btn.disabled=false}};item.append(btn)}}list.append(item)}}
await loadApplications();document.getElementById('out').onclick=async()=>{await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout'})});location.href='/'};}catch{document.getElementById('who').textContent='Bağlantı hatası'}})()</script></body></html>

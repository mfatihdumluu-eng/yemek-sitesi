<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GastroPazar — Üyelik</title><style>
:root{font:16px system-ui,sans-serif;color:#30332b;background:#f8f6ef}body{margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(440px,calc(100% - 48px));background:#fff;border-radius:18px;padding:32px;box-shadow:0 12px 32px #24231c12}h1{font-size:24px;margin-top:0}input,textarea,button{box-sizing:border-box;width:100%;font:inherit;padding:13px;border-radius:10px;border:1px solid #d3d2c8;margin:6px 0 12px}button{background:#526f45;color:white;border:0;cursor:pointer}button.alt{background:#f1f1e9;color:#34402e}small,p{line-height:1.5}a{color:#526f45}#message{min-height:30px;color:#475d3e}section[hidden]{display:none}</style></head><body><main><p><a href="/">← GastroPazar ana sayfa</a></p><h1>Hesabım</h1><p id="message" role="status"></p>
<section id="auth"><form id="f"><label for="email">E-posta</label><input id="email" type="email" autocomplete="email" required><label for="password">Şifre</label><input id="password" type="password" autocomplete="current-password" required minlength="12"><div id="newName" hidden><label for="name">Adınız</label><input id="name" autocomplete="name"></div><button type="submit" id="submit">Giriş yap</button></form><button class="alt" id="mode" type="button">Hesap oluştur</button></section>
<section id="member" hidden><p id="welcome"></p><h2>Satıcı olmak istiyorum</h2><p>Başvurunuz incelendikten sonra satıcı yetkisi verilebilir.</p><form id="chefForm"><label for="business">Mutfak / işletme adı</label><input id="business" minlength="3" maxlength="120" required><label for="description">Kısaca yaptığınız yemekleri anlatın</label><textarea id="description" maxlength="2000"></textarea><button type="submit">Başvuru gönder</button></form><button id="logout" class="alt">Çıkış yap</button></section>
</main><script>
const $=id=>document.getElementById(id),message=s=>$('message').textContent=s;let register=false;
async function call(body){const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'İşlem başarısız');return d}
function present(user){$('auth').hidden=!!user;$('member').hidden=!user;if(user)$('welcome').textContent='Merhaba, '+(user.display_name||user.email)+' ('+user.role+')'}
$('mode').onclick=()=>{register=!register;$('newName').hidden=!register;$('password').autocomplete=register?'new-password':'current-password';$('submit').textContent=register?'Hesap oluştur':'Giriş yap';$('mode').textContent=register?'Zaten hesabım var':'Hesap oluştur';message('')};
$('f').onsubmit=async e=>{e.preventDefault();message('');try{const d=await call({action:register?'register':'login',email:$('email').value,password:$('password').value,name:$('name').value});present(d.user);message('İşlem başarılı.')}catch(err){message(err.message)}};
$('chefForm').onsubmit=async e=>{e.preventDefault();try{await call({action:'apply-chef',businessName:$('business').value,description:$('description').value});message('Satıcı başvurunuz alındı; onay bekleniyor.')}catch(err){message(err.message)}};
$('logout').onclick=async()=>{try{await call({action:'logout'});present(null);message('Çıkış yapıldı.')}catch(err){message(err.message)}};
fetch('/api/auth',{credentials:'same-origin'}).then(r=>r.json()).then(d=>present(d.user)).catch(()=>message('Oturum kontrolü yapılamadı.'));
</script></body></html>
